name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -o /dev/null .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./... -v -timeout 120s

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run --timeout 5m

  docs:
    name: Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tfplugindocs
        run: go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@latest

      # Generated through the Makefile so this check and `make docs` cannot
      # disagree. Invoking tfplugindocs directly makes the provider name depend
      # on the checkout directory name, which differs between CI and a local
      # clone and silently produces a different page_title.
      - name: Generate docs
        run: make docs

      - name: Check for uncommitted docs changes
        run: |
          if [[ -n "$(git status --porcelain docs/)" ]]; then
            echo "::error::Generated docs differ from committed docs. Run 'make docs' and commit the changes."
            git diff docs/
            exit 1
          fi

  ci-pass:
    name: CI Pass
    needs: [build, test, lint, docs]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | jq -r 'to_entries[] | select(.value.result != "success") | .key' | paste -sd ', ' -)
          if [[ -n "$failed" ]]; then
            echo "Failed jobs: $failed"
            exit 1
          fi
          echo "All jobs passed."
